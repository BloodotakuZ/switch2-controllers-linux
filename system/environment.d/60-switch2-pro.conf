# SDL mapping for the ngc Pro Controller 2 virtual gamepad (057e:2069).
# Exposes GR/GL as paddle1/paddle2, C as misc1 and Capture as misc2, matching
# tools/sdl_guid.py. The GUID's CRC field is zeroed so it matches every player
# slot name ("Pro Controller 2 (P1)", "(P2)", ...).
# Install: cp to ~/.config/environment.d/, then log out and back in.
SDL_GAMECONTROLLERCONFIG=050000007e0500006920000000010000,ProController2-ngc,a:b0,b:b1,x:b3,y:b4,back:b10,guide:b12,start:b11,leftstick:b13,rightstick:b14,leftshoulder:b6,rightshoulder:b7,dpup:h0.1,dpdown:h0.4,dpleft:h0.8,dpright:h0.2,leftx:a0,lefty:a1,rightx:a3,righty:a4,lefttrigger:a2,righttrigger:a5,paddle1:b16,paddle2:b15,misc1:b2,misc2:b5,platform:Linux,
